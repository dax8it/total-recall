name: total-recall
version: 1.3.0
license: MIT
entrypoint: "__init__.py"
provider_class: "TotalRecallMemoryProvider"
requires_python: ">=3.11"
requires_hermes: ">=0.23.1"
# Catalog subdir: src. total_recall_core is bundled beside this manifest.
python_dependencies:
  - "cryptography>=42,<51"
description: "Total Recall - local-first Hermes memory provider with 23 provider tools, signed checkpoints, cited recall and explicit federation."
# register(ctx) registers a MemoryProvider, not ctx.register_tool tools.
provides_tools: []
config_schema:
  backup_passphrase:
    type: secret
    env: TOTAL_RECALL_BACKUP_PASSPHRASE
    required: false
    description: "Optional passphrase for encrypted backup export and restore."
  portable_clone_passphrase:
    type: secret
    env: TOTAL_RECALL_PORTABLE_CLONE_PASSPHRASE
    required: false
    description: "Optional passphrase for portable-clone export and restore."
